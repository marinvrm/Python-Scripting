{% extends "ynav/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1 class="title">Log in</h1>
  <form method="post" class="box" style="max-width: 24rem">
    {% csrf_token %}
    {% include "ynav/_form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}" />
    <button class="button is-link" type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'ynav:signup' %}">Sign up</a></p>
{% endblock %}
